# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: mind-iptv-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Admin panel password for the deployed instance. Set it in the Render
      # dashboard; if left blank the app falls back to addon-config.json.
      - key: ADMIN_PASSWORD
        sync: false
